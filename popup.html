<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Read Aloud（改造版）</title>

  <link rel="stylesheet" type="text/css" href="css/noto-sans-jp.css">
  <link rel="stylesheet" type="text/css" href="css/common.css">
  <link rel="stylesheet" type="text/css" href="css/popup.css">

  <script src="js/rxjs.umd.min.js"></script>
  <script src="js/jquery-3.7.1.min.js"></script>
  <script src="js/aws-sdk.js"></script>
  <script src="js/defaults.js"></script>
  <script src="js/messaging.js"></script>
  <script src="js/local-voice-server.js"></script>
  <script src="js/tts-engines.js"></script>
  <script src="js/voice-options.js"></script>
  <script src="js/bgm.js"></script>
  <script src="js/popup.js"></script>
</head>
<body>
  <!-- compact toolbar（改造版）: the voice, the speed and the settings open in the panel below, not in another page -->
  <div id="bar-row">
    <div id="bar" role="toolbar" aria-label="読み上げ">
      <button id="btnMain" type="button" class="main-btn" title="読み上げる" aria-label="読み上げる">
        <i class="material-icons">volume_up</i>
      </button>
      <button id="rate-btn" type="button" class="pill-btn" title="速度（↑↓ キーでも変えられる）" aria-label="速度" aria-controls="panel" aria-expanded="false">
        <span id="rate-value"></span>
        <i class="material-icons">expand_more</i>
      </button>
      <button id="btnPause" type="button" class="round-btn" title="一時停止（Space）" aria-label="一時停止">
        <i class="material-icons">pause</i>
      </button>
      <button id="btnExpand" type="button" class="chevron-btn" title="音声と速度" aria-label="音声と速度" aria-controls="panel" aria-expanded="false">
        <i class="material-icons">expand_more</i>
      </button>
      <button id="btnSettings" type="button" class="round-btn" title="設定" aria-label="設定" aria-controls="panel" aria-expanded="false">
        <i class="material-icons">settings</i>
      </button>
    </div>
  </div>

  <div id="panel" hidden>
    <div class="panel-label" id="voice-label">音声</div>
    <div id="voice-list" role="radiogroup" aria-labelledby="voice-label"></div>

    <hr>
    <div class="panel-label"><label for="rate-range">速度</label></div>
    <div class="slider-row">
      <input id="rate-range" type="range" min="0.5" max="3" step="0.1">
      <output id="rate-range-value" for="rate-range"></output>
    </div>

    <hr>
    <div class="panel-label">BGM</div>
    <div id="bgm-controls">
      <button id="bgm-toggle" type="button" class="bgm-toggle" aria-pressed="false" title="BGM（YouTube Music の再生リスト）を読み上げ中に流す">
        <i class="material-icons">music_note</i><span>BGM</span>
      </button>
      <input id="bgm-volume" type="range" min="0" max="100" step="1" aria-label="BGM の音量" title="BGM の音量">
      <button id="bgm-next" type="button" class="mini-btn" title="BGM を次の曲へ送る" aria-label="BGM を次の曲へ送る" disabled>
        <i class="material-icons">skip_next</i>
      </button>
      <button id="bgm-edit" type="button" class="mini-btn" title="BGM の再生リストを変える" aria-label="BGM の再生リストを変える">
        <i class="material-icons">playlist_play</i>
      </button>
    </div>
    <div id="bgm-now" role="status" title="BGM で流れている曲">
      <i class="material-icons">music_note</i><span id="bgm-title"></span>
    </div>
    <form id="bgm-setup">
      <input id="bgm-url" type="url" placeholder="YouTube Music の再生リストの URL" aria-label="YouTube Music の再生リストの URL">
      <button id="bgm-save" type="submit" class="bgm-btn">保存</button>
    </form>

    <div id="more-settings" hidden>
      <div class="panel-label"><label for="pitch-range">声の高さ</label></div>
      <div class="slider-row">
        <input id="pitch-range" type="range" min="0" max="2" step="0.05">
        <output id="pitch-range-value" for="pitch-range"></output>
      </div>
      <div class="panel-label"><label for="volume-range">音量</label></div>
      <div class="slider-row">
        <input id="volume-range" type="range" min="0.2" max="1" step="0.02">
        <output id="volume-range-value" for="volume-range"></output>
      </div>

      <hr>
      <div class="panel-label">
        <label for="all-voices">ほかの声から選ぶ</label>
        <button id="languages-edit-button" type="button" class="mini-btn" title="声の言語を選ぶ" aria-label="声の言語を選ぶ">
          <i class="material-icons">filter_alt</i>
        </button>
      </div>
      <div class="field-row">
        <select id="all-voices" class="field"></select>
      </div>
      <div class="panel-label"><label for="show-highlighting">読んでいる文の表示</label></div>
      <div class="field-row">
        <select id="show-highlighting" class="field">
          <option value="0">表示しない</option>
          <option value="1">ポップアップに表示</option>
          <option value="2">別のウィンドウに表示</option>
          <option value="3">ページ上に表示</option>
        </select>
      </div>
      <div class="audio-playback-visible">
        <div class="panel-label"><label for="audio-playback">音声の再生</label></div>
        <div class="field-row">
          <select id="audio-playback" class="field">
            <option value="false">別のタブで再生</option>
            <option value="true">ページ内で再生</option>
          </select>
        </div>
      </div>
      <label class="switch-row">
        <span>ダークモード</span>
        <input id="dark-mode-switch" type="checkbox" role="switch">
      </label>

      <hr>
      <div class="link-list">
        <button id="hotkeys-link" type="button" class="link-row"><i class="material-icons">keyboard</i>ショートカットキーを変更</button>
        <a href="advanced-options.html?referer=popup.html" class="link-row"><i class="material-icons">tune</i>詳細設定（読み方の置き換えなど）</a>
        <a href="report.html?referer=popup.html" class="link-row"><i class="material-icons">feedback</i>問題を報告</a>
        <button id="reset" type="button" class="link-row"><i class="material-icons">restart_alt</i>設定を元に戻す</button>
      </div>
      <div id="fork-label" title="日本語を 1 文ずつ読む改造版（nihi566/read-aloud の ja-sentence-highlight）">Read Aloud 改造版</div>
    </div>
  </div>

  <div id="status" role="alert">
  </div>
  <div id="local-voice-loading" role="status">声を読み込み中です（しばらく使わなかった後の最初の 1 回は 5〜10 秒かかります）</div>
  <div id="bgm-notice" role="status">
    ブラウザが BGM の自動再生を止めました。BGM のタブで再生ボタンを押してください。
    <button id="bgm-show-tab" type="button" class="bgm-btn">BGM のタブを開く</button>
  </div>

  <div id="highlight-wrap">
    <div id="highlight">
    </div>
    <button id="jump-current" type="button" title="読んでいる文まで戻り、自動で追いかける">
      <i class="material-icons">arrow_downward</i>読んでいる文へ
    </button>
  </div>

  <div id="toolbar">
    <div class="toolbar-start">
      <div class="btn-group" title="文字の大きさ">
        <button id="decrease-font-size" type="button" class="btn" aria-label="文字を小さく">
          <i class="material-icons">text_decrease</i>
        </button>
        <button id="increase-font-size" type="button" class="btn" aria-label="文字を大きく">
          <i class="material-icons">text_increase</i>
        </button>
      </div>
      <div id="keys-help">
        <button type="button" class="btn" aria-label="キー操作" aria-describedby="keys-pop">
          <i class="material-icons">keyboard</i>
        </button>
        <div id="keys-pop" role="tooltip">
          <div><kbd>Space</kbd>再生／一時停止</div>
          <div><kbd>←</kbd><kbd>→</kbd>前の文／次の文</div>
          <div><kbd>↑</kbd><kbd>↓</kbd>速く／遅く</div>
        </div>
      </div>
    </div>
    <span id="progress" aria-live="off"></span>
    <div class="toolbar-end">
      <div class="btn-group window-size" title="表示の大きさ">
        <button id="decrease-window-size" type="button" class="btn" aria-label="ウィンドウを小さく">
          <i class="material-icons">close_fullscreen</i>
        </button>
        <button id="increase-window-size" type="button" class="btn" aria-label="ウィンドウを大きく">
          <i class="material-icons">open_in_full</i>
        </button>
      </div>
    </div>
  </div>

  <div id="footer">
  </div>
</body>
</html>
