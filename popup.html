<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Read Aloud（改造版）</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto">
  <link rel="stylesheet" type="text/css" href="css/common.css">
  <link rel="stylesheet" type="text/css" href="css/popup.css">

  <script src="js/rxjs.umd.min.js"></script>
  <script src="js/jquery-3.7.1.min.js"></script>
  <script src="js/defaults.js"></script>
  <script src="js/messaging.js"></script>
  <script src="js/local-voice-server.js"></script>
  <script src="js/popup.js"></script>
</head>
<body>
  <div id="status">
  </div>
  <div id="local-voice-loading" role="status">声を読み込み中です（しばらく使わなかった後の最初の 1 回は 5〜10 秒かかります）</div>
  <div id="buttons">
    <i class="material-icons button-1" id="btnRewind">&#xe020;</i>
    <img src="img/loading.gif" id="imgLoading" />
    <i class="material-icons button-1" id="btnPlay">&#xe037;</i>
    <i class="material-icons button-1" id="btnPause">pause</i>
    <i class="material-icons button-1" id="btnStop">stop</i>
    <i class="material-icons button-1" id="btnSettings">settings</i>
    <i class="material-icons button-1" id="btnForward">&#xe01f;</i>
  </div>
  <div id="quick-controls">
    <div class="btn-group" title="読み上げの速さ（読み上げ中に変えると、今の文から読み直す）">
      <button id="decrease-rate" type="button" class="btn btn-sm btn-light" aria-label="遅くする">
        <i class="material-icons">remove</i>
      </button>
      <span id="rate-value"></span>
      <button id="increase-rate" type="button" class="btn btn-sm btn-light" aria-label="速くする">
        <i class="material-icons">add</i>
      </button>
    </div>
    <select id="quick-voice" title="声（読み上げ中に変えると、今の文から読み直す）" aria-label="声"></select>
  </div>
  <div id="highlight">
  </div>
  <div id="toolbar">
    <div class="btn-group">
      <button id="decrease-font-size" type="button" class="btn btn-sm btn-light">
        A-
      </button>
      <button id="increase-font-size" type="button" class="btn btn-sm btn-light">
        A+
      </button>
    </div>
    <div class="btn-group">
      <button id="toggle-dark-mode" type="button" class="btn btn-sm btn-light">
        <i class="material-icons">dark_mode</i>
      </button>
    </div>
    <div class="btn-group window-size">
      <button id="decrease-window-size" type="button" class="btn btn-sm btn-light">
        <i class="material-icons">remove</i>
      </button>
      <button id="increase-window-size" type="button" class="btn btn-sm btn-light">
        <i class="material-icons">add</i>
      </button>
    </div>
    <div id="fork-label" title="日本語を 1 文ずつ読む改造版（nihi566/read-aloud の ja-sentence-highlight）">改造版</div>
  </div>
  <div id="footer">
    <a href="report.html?referer=popup.html">report issues</a>
  </div>
</body>
</html>
