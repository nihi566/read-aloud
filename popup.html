<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Read Aloud（改造版）</title>

  <link rel="stylesheet" type="text/css" href="css/common.css">
  <link rel="stylesheet" type="text/css" href="css/popup.css">

  <script src="js/rxjs.umd.min.js"></script>
  <script src="js/jquery-3.7.1.min.js"></script>
  <script src="js/defaults.js"></script>
  <script src="js/messaging.js"></script>
  <script src="js/local-voice-server.js"></script>
  <script src="js/popup.js"></script>
</head>
<body>
  <header id="app-bar">
    <img id="app-icon" src="img/icon-48.png" alt="" />
    <span id="app-title">Read Aloud</span>
    <span id="fork-label" title="日本語を 1 文ずつ読む改造版（nihi566/read-aloud の ja-sentence-highlight）">改造版</span>
    <button id="toggle-dark-mode" type="button" class="icon-btn" title="ダークモード切り替え" aria-label="ダークモード切り替え">
      <i class="material-icons">dark_mode</i>
    </button>
    <button id="btnSettings" type="button" class="icon-btn" title="設定" aria-label="設定">
      <i class="material-icons">settings</i>
    </button>
  </header>

  <div id="status" role="alert">
  </div>
  <div id="local-voice-loading" role="status">声を読み込み中です（しばらく使わなかった後の最初の 1 回は 5〜10 秒かかります）</div>

  <div id="buttons">
    <button id="btnRewind" type="button" class="transport-btn" title="前の文へ" aria-label="前の文へ">
      <i class="material-icons">skip_previous</i>
    </button>
    <div id="primary-slot">
      <span id="imgLoading" class="spinner" role="status" aria-label="読み込み中"></span>
      <button id="btnPlay" type="button" class="primary-btn" title="読み上げる" aria-label="読み上げる">
        <i class="material-icons">play_arrow</i>
      </button>
      <button id="btnPause" type="button" class="primary-btn" title="一時停止" aria-label="一時停止">
        <i class="material-icons">pause</i>
      </button>
    </div>
    <button id="btnStop" type="button" class="transport-btn" title="停止" aria-label="停止">
      <i class="material-icons">stop</i>
    </button>
    <button id="btnForward" type="button" class="transport-btn" title="次の文へ" aria-label="次の文へ">
      <i class="material-icons">skip_next</i>
    </button>
  </div>
  <div id="play-hint">このページを読み上げる</div>

  <div id="quick-controls">
    <div class="stepper" title="読み上げの速さ（読み上げ中に変えると、今の文から読み直す）">
      <button id="decrease-rate" type="button" class="stepper-btn" aria-label="遅くする">
        <i class="material-icons">remove</i>
      </button>
      <span id="rate-value"></span>
      <button id="increase-rate" type="button" class="stepper-btn" aria-label="速くする">
        <i class="material-icons">add</i>
      </button>
    </div>
    <label class="voice-picker" title="声（読み上げ中に変えると、今の文から読み直す）">
      <i class="material-icons">record_voice_over</i>
      <select id="quick-voice" aria-label="声"></select>
    </label>
  </div>

  <div id="highlight">
  </div>

  <div id="toolbar">
    <div class="btn-group" title="文字の大きさ">
      <button id="decrease-font-size" type="button" class="btn" aria-label="文字を小さく">
        <i class="material-icons">text_decrease</i>
      </button>
      <button id="increase-font-size" type="button" class="btn" aria-label="文字を大きく">
        <i class="material-icons">text_increase</i>
      </button>
    </div>
    <span id="progress" aria-live="off"></span>
    <div class="btn-group window-size" title="ウィンドウの大きさ">
      <button id="decrease-window-size" type="button" class="btn" aria-label="ウィンドウを小さく">
        <i class="material-icons">close_fullscreen</i>
      </button>
      <button id="increase-window-size" type="button" class="btn" aria-label="ウィンドウを大きく">
        <i class="material-icons">open_in_full</i>
      </button>
    </div>
  </div>

  <div id="footer">
    <a href="report.html?referer=popup.html">report issues</a>
  </div>
</body>
</html>
