<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>スマートフォンと接続 - Read Aloud</title>

    <link rel="stylesheet" type="text/css" href="css/noto-sans-jp.css">
    <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="css/common.css">
    <link rel="stylesheet" type="text/css" href="css/pages.css">
    <style>
      #state-loading, #state-pairing, #state-success, #state-fail {
        display: none;
      }
      .card {
        padding: 20px 18px;
      }
      #state-loading .spinner {
        width: 28px;
        height: 28px;
        margin: 12px auto;
        border-width: 3px;
      }
      #state-pairing ol {
        margin: 0 0 16px;
        padding-left: 1.4em;
      }
      #state-pairing li + li {
        margin-top: 4px;
      }
      .nowrap {
        white-space: nowrap;
      }
      #pairing-domain {
        font-weight: 650;
        color: var(--accent);
        overflow-wrap: anywhere;
      }
      #pairing-code {
        display: block;
        width: fit-content;
        margin: 0 auto;
        padding: 10px 24px;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: .12em;
        font-variant-numeric: tabular-nums;
        color: var(--text);
        background-color: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        user-select: text;
      }
      .state-message {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px 10px;
        font-weight: 600;
      }
      .state-message .material-icons {
        font-size: 24px;
      }
      #state-success .material-icons {
        color: var(--success);
      }
      #state-fail .material-icons {
        color: var(--danger);
      }
      .state-message .msg {
        flex: 1 1 auto;
      }
    </style>

    <script src="js/rxjs.umd.min.js"></script>
    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/defaults.js"></script>
    <script src="js/connect-phone.js"></script>
  </head>

  <body>
    <div class="container">
      <div class="page-header">
        <button type="button" class="close always" aria-label="戻る" title="戻る">
          <i class="material-icons" aria-hidden="true">arrow_back</i>
        </button>
        <h2>スマートフォンで読み上げる</h2>
      </div>
      <p class="lead-text">スマートフォンと接続すると、このパソコンで開いているページをスマートフォンで読み上げられます。</p>

      <div class="card">
        <div id="state-loading">
          <div class="spinner" role="status" aria-label="準備中"></div>
        </div>
        <div id="state-pairing">
          <ol>
            <li>スマートフォンのブラウザーで <span class="nowrap">https://<span id="pairing-domain">readaloud.link</span></span> を開きます。</li>
            <li>次のペアリングコードを入力します。</li>
          </ol>
          <span id="pairing-code"></span>
        </div>
        <div id="state-success">
          <div class="state-message">
            <i class="material-icons" aria-hidden="true">check_circle</i>
            <span class="msg">ペアリングが完了しました。</span>
          </div>
        </div>
        <div id="state-fail">
          <div class="state-message">
            <i class="material-icons" aria-hidden="true">error</i>
            <span class="msg">ペアリングできませんでした。</span>
            <button type="button" id="try-again-button" class="btn btn-outline-primary">もう一度試す</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
