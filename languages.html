<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>言語の選択 - Read Aloud</title>
  <link rel="stylesheet" type="text/css" href="css/noto-sans-jp.css">
  <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css">
  <link rel="stylesheet" type="text/css" href="css/common.css">
  <link rel="stylesheet" type="text/css" href="css/pages.css">
  <style>
  #lang-list {
    margin: 16px 0 0;
    padding: 6px 0;
    background-color: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
  }
  #lang-list:empty {
    display: none;
  }
  #lang-list .form-check {
    padding: 0;
    margin: 0;
  }
  #lang-list .form-check-label {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin: 0;
    padding: 7px 18px;
    font-size: 14.5px;
    font-weight: 400;
    cursor: pointer;
    overflow-wrap: anywhere;
  }
  #lang-list .form-check-input {
    position: static;
    flex: none;
    margin: 4px 0 0;
  }
  #lang-list .lang-row > .form-check-label:hover {
    background-color: var(--surface);
  }
  #lang-list .lang-item.filtered-out {
    display: none;
  }
  #lang-list .lang-item:not(.filtered-out) ~ .lang-item:not(.filtered-out) {
    border-top: 1px solid var(--border);
  }
  .lang-name {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0 10px;
    min-width: 0;
  }
  .lang-ja {
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  .lang-native {
    font-size: 12.5px;
    color: var(--muted);
    overflow-wrap: anywhere;
  }
  .lang-filter {
    position: sticky;
    top: 0;
    z-index: 5;
    margin: 12px -4px 0;
    padding: 8px 4px;
    background-color: var(--bg);
  }
  .lang-filter .form-control {
    padding-left: 38px;
  }
  .lang-filter .material-icons {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 20px;
    color: var(--muted);
    pointer-events: none;
  }
  .lang-filter + #lang-list {
    margin-top: 4px;
  }
  #lang-empty {
    margin-top: 12px;
  }
  .voice-list {
    margin: 2px 18px 10px 44px !important;
    padding: 6px 0 !important;
    background-color: var(--surface);
    border-radius: 10px;
  }
  .voice-list .form-check-label {
    padding: 4px 14px !important;
    font-size: 13.5px !important;
    color: var(--text);
  }
  .voice-list .form-check-label.d-block {
    display: flex !important;
  }
  .voice-list input[type=radio] {
    flex: none;
    margin-top: 3px;
  }
  @media (max-width: 520px) {
    .voice-list {
      margin-left: 18px !important;
    }
  }
  </style>

  <script src="js/rxjs.umd.min.js"></script>
  <script src="js/jquery-3.7.1.min.js"></script>
  <script src="js/defaults.js"></script>
  <script src="js/local-voice-server.js"></script>
  <script src="js/tts-engines.js"></script>
  <script src="js/languages.js"></script>
</head>
<body>
  <div class="container">
    <h2 data-i18n="languages_heading"></h2>
    <p class="lead-text">読み上げに使う言語にチェックを入れてください。チェックした言語ごとに、使う声を選べます。</p>
    <form onsubmit="return false">
      <div class="lang-filter">
        <i class="material-icons" aria-hidden="true">search</i>
        <input type="search" id="lang-filter" class="form-control" autocomplete="off" placeholder="言語を検索（日本語名・現地の名前・コード）" aria-label="言語を検索">
      </div>
      <p id="lang-empty" class="lead-text" hidden>一致する言語がありません。</p>
      <div class="form-group" id="lang-list">
      </div>
    </form>
  </div>
</body>
</html>
